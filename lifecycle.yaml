---
version: '1.0.0'

environment:
  defaultServices:
    - name: 'lc-test-gh-type'
      repository: 'vmelikyan/lc-test'
      branch: 'main'
    - name: 'lc-test-3'
      repository: 'vmelikyan/lc-test-3'
      branch: 'main'
    - name: 'lc-test-4'
      repository: 'vmelikyan/lc-test-4'
      branch: 'main'
    - name: 'grpc-echo'
      repository: 'vmelikyan/lc-test'
      branch: 'main'
    - name: 'lc-test-2-app'

services:
  - name: 'lc-test-2-app'
    deploymentDependsOn:
      - 'lc-test-gh-type'
    github:
      repository: 'vmelikyan/lc-test-2'
      branchName: 'static'
      docker:
        builder:
          engine: 'buildkit'
        defaultTag: 'static'
        app:
          dockerfilePath: 'sysops/dockerfiles/app.dockerfile'
          env:
            CLIENT_HOST: 'grpc-echo:8080'
          ports:
            - 8080
      deployment:
        public: true
        resource:
          cpu:
            request: '10m'
          memory:
            request: '50Mi'
        readiness:
          tcpSocketPort: 8080
        hostnames:
          host: '0env.com'
          defaultInternalHostname: 'lc-test-2-app-dev-0'
          defaultPublicUrl: 'lc-test-2-app-dev-0.0env.com'

# config push Z1 (full pass)
